<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            table {
                border-collapse: collapse;
                width: 100%;
            }
            th, td {
                border: 1px solid black;                text-align: left;
            }
            th {
                background-color: #f2f2f2;
            }
        </style>
    </head>
<body>
    <table>
        <caption>Sample Table</caption>
        <tr >
            <th>no</th>
            <th>name</th>
            <th>age</th>
        </tr>
        <tr >
            <td rowspan="3" >1</td>
            <td colspan="2">John Doe</td>
        </tr>
        <tr>
             
            <td>Jane Smith</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Bob Johnson</td>
            <td>35</td>
        </tr>
    </table>
    
</body>
</html>
